async function loadBanner() {

        const bannerSnap = await db.ref('topBanner').once('value');

                </div>

// ✅ UPDATED SIGNUP FUNCTION - Email domain restriction (Only Gmail, Yahoo, Outlook, Hotmail, Rediffmail)
async function signup() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const pass = document.getElementById('pass').value;
    const ffName = document.getElementById('ffName').value.trim();
    const ffUid = document.getElementById('ffUid').value.trim();
    
    // Validation
    if(!name || !email || !pass || !ffName || !ffUid) {
        alert('❌ Fill all fields!');
        return;
    }
    
    if(pass.length < 6) {
        alert('❌ Password must be at least 6 characters!');
        return;
    }
    
    // Email validation regex
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailRegex.test(email)) {
        alert('❌ Please enter a valid email address!');
        return;
    }
    
    // ✅ ALLOWED DOMAINS LIST (Only these domains can signup)
    const allowedDomains = [
        'gmail.com',
        'yahoo.com', 
        'yahoo.co.in',
        'outlook.com',
        'hotmail.com',
        'rediffmail.com',
        'aol.com',
        'live.com',
        'msn.com'
    ];
    
    // Extract domain from email
    const emailDomain = email.split('@')[1];
    
    // Check if domain is allowed
    if(!allowedDomains.includes(emailDomain)) {
        alert(`❌ Only these email domains are allowed:\n\n${allowedDomains.join(', ')}\n\nYour email: ${email}\nDomain: ${emailDomain} is NOT allowed.\n\nPlease use Gmail, Yahoo, Outlook, Hotmail, or Rediffmail.`);
        return;
    }
    
    try {
        // Check if email already exists (case-insensitive)
        const usersRef = db.ref('users');
        const snapshot = await usersRef.orderByChild('email').equalTo(email).once('value');
        
        if(snapshot.exists()) {
            alert('❌ This email is already registered! Please use a different email or login.');
            return;
        }
        
        // Double check for any case variation (extra security)
        let duplicateFound = false;
        const allUsers = await usersRef.once('value');
        allUsers.forEach((userSnap) => {
            const userData = userSnap.val();
            if(userData.email && userData.email.toLowerCase() === email) {
                duplicateFound = true;
            }
        });
        
        if(duplicateFound) {
            alert('❌ This email is already registered! Please login instead.');
            return;
        }
        
        // Create new user
        await db.ref('users').push({
            name: name,
            email: email,
            password: pass,
            balance: 0,
            ffName: ffName,
            ffUid: ffUid,
            createdAt: new Date().toISOString()
        });
        
        alert('✅ Account created successfully! Please login.');
        loginScreen();
        
    } catch(e) { 
        alert("❌ Error: " + e.message); 
    }
}

async function login() {
    const email=document.getElementById('email').value.trim().toLowerCase();
    const pass=document.getElementById('pass').value;
    try {
        const snap = await db.ref('users').orderByChild('email').equalTo(email).once('value');
        let data=null, uid=null;
        snap.forEach(s=>{ data=s.val(); uid=s.key; });
        if(!data) return alert('User not found');
        if(data.password!==pass) return alert('Wrong password');
        user={id:uid,name:data.name,email:data.email,balance:data.balance||0,ffName:data.ffName,ffUid:data.ffUid};
        home();
    } catch(e) { alert("Error: "+e.message); }
}

function showRegistrationModal(tournamentId, fees) {

    if(fees > 0 && user.balance < fees) {
        alert(`❌ Insufficient balance! Need ₹${fees}, you have ₹${user.balance}`);
        return;
    }
    
    const mode = tournament.mode || 'Solo';
    let teamFields = '';
    
    if(mode === 'Solo') {
        teamFields = `<div class="team-input-group"><div class="team-title">🎮 YOUR DETAILS</div><input type="text" id="p1_name" placeholder="Your Nickname" value="${user.ffName || ''}"><input type="text" id="p1_uid" placeholder="Your UID" value="${user.ffUid || ''}"></div>`;

        teamFields = `

    } else if(mode === 'Squad') {
        teamFields = `
            <div class="team-input-group">
                <div class="team-title">🏷️ TEAM NAME</div>
                <input type="text" id="teamName" placeholder="Enter your team name (e.g., GMR Warriors)">
            </div>
            <div class="team-input-group"><div class="team-title">👤 PLAYER 1 (YOU)</div><input type="text" id="p1_name" placeholder="Your Nickname" value="${user.ffName || ''}"><input type="text" id="p1_uid" placeholder="Your UID" value="${user.ffUid || ''}"></div>
            <div class="team-input-group"><div class="team-title">👥 PLAYER 2</div><input type="text" id="p2_name" placeholder="Player 2 Nickname"><input type="text" id="p2_uid" placeholder="Player 2 UID"></div>
            <div class="team-input-group"><div class="team-title">👥 PLAYER 3</div><input type="text" id="p3_name" placeholder="Player 3 Nickname"><input type="text" id="p3_uid" placeholder="Player 3 UID"></div>
            <div class="team-input-group"><div class="team-title">👥 PLAYER 4</div><input type="text" id="p4_name" placeholder="Player 4 Nickname"><input type="text" id="p4_uid" placeholder="Player 4 UID"></div>`;
    }
    
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-title">🎮 ${mode} REGISTRATION</div>
            <div style="text-align:center;margin:10px 0;"><strong>🏆 ${tournament.name}</strong><br>💰 Entry Fee: ${fees === 0 ? 'FREE' : '₹'+fees}</div>
            ${teamFields}
            <div class="rules-list">
                <strong>📜 TOURNAMENT RULES (Read Carefully):</strong>
                <ol>
                    <li>Screen Recording is mandatory for all players</li>
                    <li>No hacking/cheating - Immediate disqualification & ban</li>
                    <li>Join room on time (10 minutes before match)</li>
                    <li>No abusive language in chat/Discord/Game</li>
                    <li>Report your score immediately after match in Discord</li>
                    <li>If any player disconnects during match, match continues</li>
                    <li>No late entries will be accepted</li>
                    <li>Admin decision will be final in any dispute</li>
                </ol>
            </div>
            <div class="warning-text">⚠️ By registering, you agree to all above rules. Violation will lead to disqualification without refund!</div>
            <button class="btn-green" id="confirmReg" style="width:100%;">✅ ${fees === 0 ? 'JOIN FREE' : 'CONFIRM & PAY ₹'+fees}</button>
            <button class="btn-red" id="cancelReg" style="width:100%;margin-top:10px;">❌ CANCEL</button>
        </div>`;
    document.body.appendChild(modal);
    
    document.getElementById('confirmReg').onclick = async () => {
        let teamMembers = [];
        let teamName = '';
        
        if(mode === 'Solo') {
            const name = document.getElementById('p1_name').value;
            const uid = document.getElementById('p1_uid').value;
            if(!name || !uid) return alert('❌ Please fill your details');
            teamMembers = [{name, uid, isLeader: true}];
        } else {
            teamName = document.getElementById('teamName')?.value.trim() || `Team ${user.name}`;
            const p1n = document.getElementById('p1_name').value, p1u = document.getElementById('p1_uid').value;
            const p2n = document.getElementById('p2_name').value, p2u = document.getElementById('p2_uid').value;
            if(!p1n || !p1u) return alert('❌ Fill your details');
            if(!p2n || !p2u) return alert('❌ Fill teammate details');
            
            if(mode === 'Duo') {
                teamMembers = [{name: p1n, uid: p1u, isLeader: true}, {name: p2n, uid: p2u, isLeader: false}];
            } else {
                const p3n = document.getElementById('p3_name').value, p3u = document.getElementById('p3_uid').value;
                const p4n = document.getElementById('p4_name').value, p4u = document.getElementById('p4_uid').value;
                if(!p3n || !p3u) return alert('❌ Fill player 3 details');
                if(!p4n || !p4u) return alert('❌ Fill player 4 details');
                teamMembers = [
                    {name: p1n, uid: p1u, isLeader: true},
                    {name: p2n, uid: p2u, isLeader: false},
                    {name: p3n, uid: p3u, isLeader: false},
                    {name: p4n, uid: p4u, isLeader: false}
                ];
            }
        }
        modal.remove();
        
        const parts = tournament.participants || {};
        parts[user.id] = { 
            name: user.name, 
            email: user.email, 
            teamMembers, 
            teamName: teamName || null,
            mode, 
            joinedAt: new Date().toISOString() 
        };
        
        if(teamMembers[0]) {
            await db.ref(`users/${user.id}`).update({ ffName: teamMembers[0].name, ffUid: teamMembers[0].uid });
            user.ffName = teamMembers[0].name;
            user.ffUid = teamMembers[0].uid;
        }
        
        await db.ref(`tournaments/${tournamentId}`).update({ participants: parts });
        
        let paymentMsg = '';
        if(fees > 0) {
            const oldUserBalance = user.balance;
            await db.ref(`users/${user.id}`).update({ balance: user.balance - fees });
            
            const adminId = tournament.adminId;
            const adminSnap = await db.ref(`admins/${adminId}`).once('value');
            const oldAdminBalance = adminSnap.val()?.balance || 0;
            await db.ref(`admins/${adminId}`).update({ balance: oldAdminBalance + fees });
            
            user.balance -= fees;
            paymentMsg = `\n\n💰 PAYMENT:\n💳 YOUR BALANCE: ₹${oldUserBalance} → ₹${user.balance}`;
        } else {
            paymentMsg = `\n\n🎁 FREE TOURNAMENT - No payment required!`;
        }
        
        alert(`✅ REGISTERED SUCCESSFULLY!\n\n🏆 ${tournament.name}\n🎮 Mode: ${mode}${teamName ? `\n🏷️ Team Name: ${teamName}` : ''}\n💰 Entry Fee: ${fees === 0 ? 'FREE' : '₹'+fees}${paymentMsg}\n\n🔑 Room ID: ${tournament.roomId}\n🔐 Password: ${tournament.roomPass}\n\n📹 Screen Recording Mandatory!\n\n📜 You can view tournament details anytime in "MY JOINED TOURNAMENTS" section.`);
        
        home();
    };
    document.getElementById('cancelReg').onclick = () => modal.remove();
}

            <div class="modal-title">💰 ADD MONEY</div>
            ${payment.qrImageBase64?`<img src="${payment.qrImageBase64}" style="max-width:140px;margin:10px auto;display:block;border-radius:10px;">`:'<div style="text-align:center;color:#f59e0b;padding:15px;">⚠️ QR not available</div>'}
            <div style="background:rgba(6,182,212,0.1);padding:10px;border-radius:10px;margin:10px 0;"><strong>UPI:</strong> ${payment.upiId||'gmr@okhdfcbank'}</div>
            <input type="text" id="upi" placeholder="Your UPI ID">
            <input type="number" id="amt" placeholder="Amount (₹)" min="10">
            <button class="btn-green" id="submitAdd">SUBMIT</button>
            <button class="btn-red" id="closeAdd">CANCEL</button>
        </div>`;
    document.body.appendChild(modal);
    document.getElementById('submitAdd').onclick = async () => {
        const upi = document.getElementById('upi').value, amt = parseInt(document.getElementById('amt').value);
        if(!upi || !amt) return alert('Fill fields');
        await db.ref(`addMoneyRequests/${user.id}`).push({ upi, amount: amt, userName: user.name, userEmail: user.email, status: 'pending', requestedAt: new Date().toISOString() });
        alert(`✅ Request sent! ₹${amt} will be added after verification.`);
        modal.remove();
    };
    document.getElementById('closeAdd').onclick = () => modal.remove();
}

function withdrawModal() {
    const modal = document.createElement('div');
    modal.className = 'modal';
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-title">💸 WITHDRAW</div>
            <div style="text-align:center;margin-bottom:15px;">Balance: <strong style="color:#10b981;">₹${user.balance}</strong></div>
            <input type="text" id="upi" placeholder="UPI ID">
            <input type="number" id="amt" placeholder="Amount (₹)" min="50" max="${user.balance}">
            <button class="btn-blue" id="submitW">WITHDRAW</button>
            <button class="btn-red" id="closeW">CANCEL</button>
        </div>`;
    document.body.appendChild(modal);
    document.getElementById('submitW').onclick = async () => {
        const upi = document.getElementById('upi').value, amt = parseInt(document.getElementById('amt').value);
        if(!upi || !amt) return alert('Fill fields');
        if(amt > user.balance) return alert('Insufficient balance');
        await db.ref(`withdrawRequests/${user.id}`).push({ upi, amount: amt, userName: user.name, userEmail: user.email, status: 'pending', requestedAt: new Date().toISOString() });
        await db.ref(`users/${user.id}`).update({ balance: user.balance - amt });
        user.balance -= amt;
        alert(`✅ Withdrawal request sent! ₹${amt} will be sent to ${upi} within 24-48 hours.`);
        modal.remove();
        home();
    };
    document.getElementById('closeW').onclick = () => modal.remove();
}

main();
</script>
</body>
</html>
